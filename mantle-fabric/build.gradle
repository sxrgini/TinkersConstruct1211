/*
 * Mantle (Fabric port)
 * Based on the NeoForge 1.21 build of Mantle by Slime Knights.
 */
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'fabric-loom' version "${loom_version}"
    id 'idea'
    id 'io.freefair.lombok' version '8.6'
}

repositories {
    mavenCentral()
    maven { name = "Prog's Maven"; url = 'https://dvs1.progwml6.com/files/maven' }
    maven { name = "Jared's maven"; url = 'https://maven.blamejared.com/' }
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
}

group = 'slimeknights.mantle'
base { archivesName = 'Mantle-Fabric' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

ext.artifact_version = System.getenv().ARTIFACT_VERSION ?: "${mod_version}.DEV"
version = "${minecraft_version}-${artifact_version}"

sourceSets.main.resources {
    srcDirs("src/generated/resources")
    exclude("src/generated/**/.cache")
}

loom {
    // TODO: convert accesstransformer.neoforge.reference.cfg into this access widener
    // accessWidenerPath = file('src/main/resources/mantle.accesswidener')

    runs {
        datagen {
            inherit server
            name 'Data Generation'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/generated/resources')}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            runDir 'build/datagen'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    compileOnly 'com.google.errorprone:error_prone_annotations:2.36.0'

    // JEI (optional)
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

tasks.register('generateModMetadata', ProcessResources) {
    def props = [
        'version': artifact_version,
        'minecraft_range': minecraft_range,
        'loader_version': loader_version,
        'jei_range': jei_range
    ]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir tasks.named('generateModMetadata')

jar {
    manifest {
        attributes([
            "Specification-Title"   : "Mantle",
            "Specification-Vendor"  : "Slime Knights",
            "Specification-Version" : "1",
            "Implementation-Title"  : project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" : "Slime Knights"
        ])
    }
}

java { withSourcesJar() }

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}
