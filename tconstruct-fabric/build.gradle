/*
 * Tinkers' Construct (Fabric port, Minecraft 1.21.1)
 * Depends on the Fabric Mantle port in ../mantle-fabric, build it first with `./gradlew remapJar` there.
 */
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'fabric-loom' version "${loom_version}"
    id 'idea'
    id 'io.freefair.lombok' version '8.6'
}

repositories {
    mavenCentral()
    maven { name = "Prog's Maven"; url = 'https://dvs1.progwml6.com/files/maven' }
    maven { name = "Jared's maven"; url = 'https://maven.blamejared.com/' }
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
}

group = 'slimeknights.tconstruct'
base { archivesName = 'TConstruct-Fabric' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
version = "${minecraft_version}-${mod_version}"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Mantle, built from ../mantle-fabric
    modImplementation files(fileTree(dir: '../mantle-fabric/build/libs', include: 'Mantle-Fabric-*.jar', exclude: '*-sources.jar'))

    compileOnly 'com.google.errorprone:error_prone_annotations:2.36.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

// Datagen providers are ported last (Fabric datagen entrypoint), keep them out of the compile until then.
// Remove entries from this list as each package is ported. See docs/FABRIC_PORT_PLAN.md.
def keepData = [
    'slimeknights/tconstruct/tools/data/material/MaterialIds.java',
    'slimeknights/tconstruct/tools/data/ModifierIds.java',
    'slimeknights/tconstruct/common/data/advancement/AdvancementIds.java',
    'slimeknights/tconstruct/smeltery/data/SmelteryCompat.java',
    'slimeknights/tconstruct/tools/data/sprite/TinkerPartSpriteProvider.java',
]
sourceSets.main.java {
    exclude 'slimeknights/tconstruct/plugin/**'
    exclude 'slimeknights/tconstruct/shared/command/subcommand/GenerateMeltingRecipesCommand.java'
    // recipe builders are datagen helpers, ported with datagen
    exclude '**/recipe/**/*Builder.java'
    exclude 'slimeknights/tconstruct/common/recipe/LoadableFinishedRecipe.java'
    exclude { el ->
        if (el.directory) return false
        def p = el.relativePath.pathString
        (p ==~ /slimeknights\/tconstruct\/[^\/]+\/data\/.*/ || p.startsWith('slimeknights/tconstruct/library/data/')) && !keepData.contains(p)
    }
}

java { withSourcesJar() }

loom {
    accessWidenerPath = file('src/main/resources/tconstruct.accesswidener')
}

tasks.register('generateModMetadata', ProcessResources) {
    def props = [
        'version': mod_version,
        'minecraft_range': minecraft_range,
        'loader_version': loader_version,
        'jei_range': '>=19.0'
    ]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir tasks.named('generateModMetadata')
